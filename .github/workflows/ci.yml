name: CI
on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install --upgrade pip
      - run: pip install .
      - run: python -c "import demo_pkg; print(demo_pkg.hello())"
      - name: Deploy (requires secret)
        run: |
          if [ -z "${{ secrets.DEPLOY_KEY }}" ]; then
            echo 'Error: required secret DEPLOY_KEY is not set; cannot authenticate to deploy target'
            exit 1
          fi
